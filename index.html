<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competitor Tracker MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center font-sans p-4">
    
    <div class="bg-white p-8 rounded-xl shadow-lg border border-slate-100 w-full max-w-2xl">
        <div class="mb-6 text-center">
            <h1 class="text-2xl font-bold text-slate-800">Competitor Tracker</h1>
            <p class="text-sm text-slate-500 mt-1">Monitor pricing pages and feature updates.</p>
        </div>

        <form id="trackerForm" class="space-y-4">
            <div>
                <label for="urlInput" class="block text-sm font-medium text-slate-700 mb-1">Target URL</label>
                <input 
                    type="url" 
                    id="urlInput" 
                    placeholder="https://competitor.com/pricing" 
                    required
                    class="w-full px-4 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                >
            </div>

            <button 
                type="submit" 
                id="checkBtn"
                class="w-full bg-blue-600 text-white font-medium py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200 disabled:bg-blue-400 disabled:cursor-not-allowed"
            >
                Check for Updates
            </button>
        </form>

        <div id="resultBox" class="mt-6 hidden p-5 rounded-md border text-sm transition-all">
            <p id="resultStatus" class="font-bold mb-3 text-lg"></p>
            
            <div id="summaryContainer" class="mb-4 hidden">
                <h3 class="font-semibold text-slate-800 mb-2">AI Analysis:</h3>
                <div id="summaryContent" class="text-slate-700 space-y-2"></div>
            </div>

            <button id="toggleDiffBtn" type="button" class="hidden text-blue-600 hover:text-blue-800 font-medium text-sm transition focus:outline-none">
                + View Raw Changes
            </button>
            <pre id="rawDiffContent" class="hidden mt-3 bg-slate-900 text-slate-300 p-4 rounded-md overflow-x-auto whitespace-pre-wrap font-mono text-xs border border-slate-700"></pre>
        </div>
    </div>

    <script>
        const form = document.getElementById('trackerForm');
        const urlInput = document.getElementById('urlInput');
        const checkBtn = document.getElementById('checkBtn');
        const resultBox = document.getElementById('resultBox');
        const resultStatus = document.getElementById('resultStatus');
        const summaryContainer = document.getElementById('summaryContainer');
        const summaryContent = document.getElementById('summaryContent');
        const toggleDiffBtn = document.getElementById('toggleDiffBtn');
        const rawDiffContent = document.getElementById('rawDiffContent');

        // Toggle Diff Visibility
        toggleDiffBtn.addEventListener('click', () => {
            const isHidden = rawDiffContent.classList.contains('hidden');
            if (isHidden) {
                rawDiffContent.classList.remove('hidden');
                toggleDiffBtn.textContent = '- Hide Raw Changes';
            } else {
                rawDiffContent.classList.add('hidden');
                toggleDiffBtn.textContent = '+ View Raw Changes';
            }
        });

        // Main Form Submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = urlInput.value.trim();
            if (!url) return;

            // 1. Reset UI State
            checkBtn.disabled = true;
            checkBtn.textContent = 'Analyzing...';
            
            resultBox.classList.add('hidden');
            resultBox.classList.remove('bg-green-50', 'border-green-200', 'bg-slate-50', 'border-slate-200', 'bg-red-50', 'border-red-200');
            
            summaryContainer.classList.add('hidden');
            toggleDiffBtn.classList.add('hidden');
            rawDiffContent.classList.add('hidden');
            toggleDiffBtn.textContent = '+ View Raw Changes'; // Reset toggle text

            try {
                // 2. Call the API
                const response = await fetch('/api/check_url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                // 3. Display Results
                resultBox.classList.remove('hidden');
                
                if (data.status === 'error') {
                    resultBox.classList.add('bg-red-50', 'border-red-200', 'text-red-800');
                    resultStatus.textContent = "⚠️ " + data.message;
                } else if (data.changed) {
                    resultBox.classList.add('bg-green-50', 'border-green-200');
                    resultStatus.className = "font-bold mb-3 text-lg text-green-800";
                    resultStatus.textContent = "✅ " + data.message;
                    
                    // Inject AI Summary
                    if (data.summary) {
                        summaryContainer.classList.remove('hidden');
                        summaryContent.innerHTML = data.summary;
                    }

                    // Setup Raw Diff Toggle
                    if (data.raw_diff && data.raw_diff !== "No previous data to compare against.") {
                        toggleDiffBtn.classList.remove('hidden');
                        rawDiffContent.textContent = data.raw_diff;
                    }

                } else {
                    resultBox.classList.add('bg-slate-50', 'border-slate-200');
                    resultStatus.className = "font-bold mb-3 text-lg text-slate-800";
                    resultStatus.textContent = "⏸️ " + data.message;
                }

            } catch (error) {
                resultBox.classList.remove('hidden');
                resultBox.classList.add('bg-red-50', 'border-red-200');
                resultStatus.className = "font-bold mb-3 text-lg text-red-800";
                resultStatus.textContent = "⚠️ Network error. Ensure the Uvicorn server is running.";
            } finally {
                checkBtn.disabled = false;
                checkBtn.textContent = 'Check for Updates';
            }
        });
    </script>
</body>
</html>
